name: Ruff

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Compile all Python modules
        run: python -m compileall -q tidal_dl tests

      - name: Lint changed policy modules
        run: ruff check tidal_dl/manifest.py tidal_dl/exceptions.py tidal_dl/downloader.py tidal_dl/metadata.py tidal_dl/lyrics.py tidal_dl/lyrics_cmd.py tidal_dl/inspect_cmd.py --select E9,F