name: Publish to PyPI

on:
  release:
    types: [published]
  # Botão manual para publicar sem precisar criar uma release no GitHub.
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Versão a forçar no PyPI (ex.: 2.5.6) -- obrigatório, sem default de propósito (ver nota abaixo)'
        required: true
        # ANTES: default: '2.5.2' -- um valor fixo que ficava desatualizado
        # a cada release e nunca era atualizado junto. Sem perceber, dar
        # play no dispatch manual sem preencher o campo publicaria essa
        # versão antiga de novo no PyPI. Removido: agora o campo fica
        # vazio até alguém preencher de propósito.

jobs:
  # Roda a MESMA suíte de tests.yml antes de publicar -- sem isso, uma
  # release com testes quebrados ainda subia pro PyPI normalmente, já que
  # `release: published` não tinha nenhuma relação com o resultado do CI.
  testes:
    uses: ./.github/workflows/tests.yml

  pypi-publish:
    name: Build and publish to PyPI
    needs: testes
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout do código
      uses: actions/checkout@v7

    - name: Setup Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Extrai a versão
      id: extract_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.manual_version }}"
        else
          VERSION=${GITHUB_REF_NAME#v}
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Versão que será injetada: $VERSION"

    - name: Sobrescreve __version__ no dispatch manual
      # ANTES: esse valor era calculado e guardado em $VERSION, mas nunca
      # era usado em lugar nenhum -- `python -m build` sempre lia a versão
      # de qobuz_dl/__init__.py (via pyproject.toml, version = {attr =
      # "qobuz_dl.__version__"}), ignorando por completo o input manual.
      # O botão "forçar versão" não forçava nada. Este passo escreve
      # $VERSION de volta no __init__.py ANTES do build, só quando o
      # gatilho é o dispatch manual -- numa release publicada normal, o
      # __init__.py já reflete a versão certa (é de lá que o "Bump
      # version to X" de cada release parte), então não precisa reescrever.
      if: github.event_name == 'workflow_dispatch'
      run: |
        sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" tidal_dl/__init__.py
        echo "Conferindo o __init__.py atualizado:"
        grep "^__version__" tidal_dl/__init__.py

    - name: Instala as ferramentas de build
      run: python -m pip install --upgrade pip build

    - name: Compila o pacote
      run: python -m build

    - name: Publica no PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
